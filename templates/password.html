{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 720px;">
  <h2 class="page-section-title">修改密码</h2>
  <p class="page-section-subtitle">更新当前账户的登录密码，建议使用高强度密码。</p>
  <form action="/web/profile/password" method="post">
    <label>当前密码</label>
    <input type="password" name="current_password" required />
    <label>新密码</label>
    <input type="password" name="new_password" required />
    <div style="margin-top: 18px;"><button type="submit">更新密码</button></div>
  </form>
</div>
{% endblock %}
